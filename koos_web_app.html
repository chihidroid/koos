<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOOS & Lysholm マークシート入力ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Excel出力用ライブラリ (SheetJS) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-xl font-bold mb-2 text-slate-700">KOOS & Lysholm マークシート入力</h1>
        <p class="text-xs text-slate-500 mb-6">紙の問診票を見ながらマーク（選択）し、下部のボタンでExcelを出力します。</p>

        <!-- 患者情報 -->
        <div class="mb-6 p-4 bg-slate-50 rounded-lg border">
            <label class="block text-xs font-semibold text-slate-600 mb-1">患者ID / 氏名</label>
            <input type="text" id="patientId" placeholder="例: 123456 (山田太郎)" class="w-full text-sm p-2 border rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <!-- KOOS 簡易サンプルセクション (※必要に応じて項目を追加・調整可能) -->
        <div class="space-y-6 mb-6">
            <!-- 痛み (Pain) -->
            <div class="p-4 bg-blue-50 rounded-lg border border-blue-100">
                <h2 class="text-sm font-bold text-blue-800 mb-2">1. 痛み (Pain) 代表項目</h2>
                <div class="space-y-2 text-xs">
                    <div>
                        <p class="font-medium text-slate-700 mb-1">Q1: 膝の痛みはどの頻度ですか？</p>
                        <div class="grid grid-cols-5 gap-1 text-center">
                            <label class="bg-white p-2 rounded border cursor-pointer hover:bg-blue-150"><input type="radio" name="pain1" value="0" class="block mx-auto mb-1">全くない</label>
                            <label class="bg-white p-2 rounded border cursor-pointer hover:bg-blue-150"><input type="radio" name="pain1" value="25" class="block mx-auto mb-1">稀に</label>
                            <label class="bg-white p-2 rounded border cursor-pointer hover:bg-blue-150"><input type="radio" name="pain1" value="50" class="block mx-auto mb-1">時々</label>
                            <label class="bg-white p-2 rounded border cursor-pointer hover:bg-blue-150"><input type="radio" name="pain1" value="75" class="block mx-auto mb-1">しばしば</label>
                            <label class="bg-white p-2 rounded border cursor-pointer hover:bg-blue-150"><input type="radio" name="pain1" value="100" class="block mx-auto mb-1">いつも</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 日常生活動作 (ADL) -->
            <div class="p-4 bg-emerald-50 rounded-lg border border-emerald-100">
                <h2 class="text-sm font-bold text-emerald-800 mb-2">2. 日常生活動作 (ADL) 代表項目</h2>
                <div class="space-y-2 text-xs">
                    <div>
                        <p class="font-medium text-slate-700 mb-1">Q2: 階段を下りるときの手間は？</p>
                        <div class="grid grid-cols-5 gap-1 text-center">
                            <label class="bg-white p-2 rounded border cursor-pointer"><input type="radio" name="adl1" value="0" class="block mx-auto mb-1">全くない</label>
                            <label class="bg-white p-2 rounded border cursor-pointer"><input type="radio" name="adl1" value="25" class="block mx-auto mb-1">軽い</label>
                            <label class="bg-white p-2 rounded border cursor-pointer"><input type="radio" name="adl1" value="50" class="block mx-auto mb-1">中等度</label>
                            <label class="bg-white p-2 rounded border cursor-pointer"><input type="radio" name="adl1" value="75" class="block mx-auto mb-1">重度</label>
                            <label class="bg-white p-2 rounded border cursor-pointer"><input type="radio" name="adl1" value="100" class="block mx-auto mb-1">極めて重度</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lysholm Score -->
            <div class="p-4 bg-amber-50 rounded-lg border border-amber-100">
                <h2 class="text-sm font-bold text-amber-800 mb-2">3. Lysholm Score 簡易入力</h2>
                <div class="space-y-2 text-xs">
                    <div>
                        <p class="font-medium text-slate-700 mb-1">不安定性 (Instability) 評価</p>
                        <select id="lysholmInstability" class="w-full p-2 border rounded bg-white text-xs">
                            <option value="25">崩れることは全くない (25点)</option>
                            <option value="20">スポーツ時にたまに不安定 (20点)</option>
                            <option value="15">日常動作で不安定 (15点)</option>
                            <option value="10">頻繁に膝が崩れる (10点)</option>
                            <option value="0">歩行中も常に崩れる (0点)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- アクションボタン -->
        <button onclick="exportExcel()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold shadow hover:bg-blue-700 transition text-sm">
            Excel (xlsx) をダウンロード
        </button>
    </div>

    <script>
        function exportExcel() {
            const patientId = document.getElementById('patientId').value.trim() || "未設定ID";
            
            // 選択された値の取得（例として簡易的に集計）
            const painSelected = document.querySelector('input[name="pain1"]:checked');
            const adlSelected = document.querySelector('input[name="adl1"]:checked');
            const lysholmVal = document.getElementById('lysholmInstability').value;

            const painScore = painSelected ? parseInt(painSelected.value) : 0;
            const adlScore = adlSelected ? parseInt(adlSelected.value) : 0;

            const rowData = [{
                "患者ID": patientId,
                "入力日時": new Date().toLocaleString(),
                "KOOS_痛み_Q1": painScore,
                "KOOS_ADL_Q2": adlScore,
                "Lysholm_不安定性": parseInt(lysholmVal)
            }];

            const worksheet = XLSX.utils.json_to_sheet(rowData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "マークシート集計");

            XLSX.writeFile(workbook, `KOOS_Marksheet_${patientId}.xlsx`);
        }
    </script>
</body>
</html>
