<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOOS & Lysholm AI 読み取りツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Excel出力用 (SheetJS) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md space-y-6">
        <div>
            <h1 class="text-xl font-bold text-slate-700">KOOS / Lysholm AIスキャナー</h1>
            <p class="text-xs text-slate-500 mt-1">紙の問診票を撮影し、IDのみを指定してAI解析・Excel出力を行います。</p>
        </div>

        <!-- APIキー設定エリア -->
        <div class="p-4 bg-slate-50 rounded-lg border space-y-2">
            <label class="block text-xs font-semibold text-slate-600">Google AI Studio APIキー</label>
            <div class="flex gap-2">
                <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full text-xs p-2 border rounded bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <button onclick="saveApiKey()" class="bg-slate-700 text-white text-xs px-4 py-2 rounded font-medium hover:bg-slate-800 transition">保存</button>
            </div>
            <p class="text-[10px] text-slate-400">※キーはブラウザ内（LocalStorage）にのみ保存され、外部には流出しません。</p>
        </div>

        <!-- 患者ID（個人情報は入れずIDのみ） -->
        <div class="p-4 bg-blue-50 rounded-lg border border-blue-100 space-y-2">
            <label class="block text-xs font-semibold text-blue-800">患者ID（個人情報は含めないこと）</label>
            <input type="text" id="patientId" placeholder="例: PT-12345" class="w-full text-xs p-2 border rounded bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <!-- 画像アップロードエリア -->
        <div class="p-4 border-2 border-dashed border-slate-300 rounded-lg text-center space-y-3">
            <label class="block text-xs font-semibold text-slate-600">問診票の画像を選択・撮影</label>
            <input type="file" id="imageInput" accept="image/*" capture="environment" class="text-xs w-full text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" />
            <div id="previewContainer" class="hidden mt-2">
                <img id="imagePreview" class="max-h-48 mx-auto rounded border shadow-sm" alt="プレビュー" />
            </div>
        </div>

        <!-- 解析実行ボタン -->
        <button onclick="analyzeImage()" id="analyzeBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold shadow hover:bg-blue-700 transition text-sm flex items-center justify-center gap-2">
            AI解析を実行する
        </button>

        <!-- ステータス・結果表示 -->
        <div id="statusArea" class="hidden p-3 bg-amber-50 text-amber-800 rounded-lg text-xs font-medium"></div>

        <div id="resultContainer" class="hidden space-y-4 pt-4 border-t">
            <h2 class="text-sm font-bold text-slate-700">解析・抽出結果（確認用）</h2>
            <div id="resultOutput" class="p-3 bg-slate-50 rounded border text-xs font-mono whitespace-pre-wrap max-h-40 overflow-y-auto"></div>
            
            <button onclick="exportExcel()" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold shadow hover:bg-emerald-700 transition text-sm">
                Excel (xlsx) をダウンロード
            </button>
        </div>
    </div>

    <script>
        // ページロード時に保存済みAPIキーを復元
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('APIキーをブラウザに保存しました。');
            } else {
                localStorage.removeItem('gemini_api_key');
                alert('APIキーを削除しました。');
            }
        }

        let base64Image = null;
        let lastParsedData = null;

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                base64Image = uploadEvent.target.result;
                const preview = document.getElementById('imagePreview');
                preview.src = base64Image;
                document.getElementById('previewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        });

async function analyzeImage() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const patientId = document.getElementById('patientId').value.trim();

            if (!apiKey) {
                alert('APIキーを入力してください。');
                return;
            }
            if (!patientId) {
                alert('患者IDを入力してください。');
                return;
            }
            if (!base64Image) {
                alert('問診票の画像を選択してください。');
                return;
            }

            const statusArea = document.getElementById('statusArea');
            statusArea.textContent = 'AIが画像を解析中です... しばらくお待ちください。';
            statusArea.classList.remove('hidden');
            document.getElementById('analyzeBtn').disabled = true;

            const matches = base64Image.match(/^data:(.+?);base64,(.+)$/);
            if (!matches) {
                alert('画像の読み込みに失敗しました。');
                statusArea.classList.add('hidden');
                document.getElementById('analyzeBtn').disabled = false;
                return;
            }
            const mimeType = matches[1];
            const base64Data = matches[2];

            const promptText = `
あなたは医療文書のデータ抽出アシスタントです。
添付された画像は膝関節評価用問診票（KOOSまたはLysholm）です。
チェックが入っている箇所や選択されている項目を正確に読み取り、以下のJSONフォーマットのみで結果を出力してください。余計な解説文は一切不要です。

{
  "scaleType": "KOOS または Lysholm",
  "scores": {
    "subscale_or_item_name": 抽出された数値またはスコア
  },
  "rawNotes": "特記事項や読み取りメモがあれば簡潔に"
}
            `.trim();

            const requestBody = {
                contents: [{
                    parts: [
                        { text: promptText },
                        {
                            inline_data: {
                                mime_type: mimeType,
                                data: base64Data
                            }
                        }
                    ]
                }]
            };

            try {
                // モデル名を確実なもの（gemini-2.5-flash）に変更
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiText = data.candidates[0].content.parts[0].text;
                const cleanJsonStr = aiText.replace(/```json/g, '').replace(/```/g, '').trim();
                lastParsedData = JSON.parse(cleanJsonStr);

                document.getElementById('resultOutput').textContent = JSON.stringify(lastParsedData, null, 2);
                document.getElementById('resultContainer').classList.remove('hidden');
                statusArea.textContent = '解析が完了しました。内容を確認してExcelを出力してください。';
                statusArea.classList.remove('bg-amber-50', 'text-amber-800');
                statusArea.classList.add('bg-emerald-50', 'text-emerald-800');

            } catch (error) {
                console.error(error);
                statusArea.textContent = 'エラーが発生しました: ' + error.message;
                statusArea.classList.add('bg-rose-50', 'text-rose-800');
            } finally {
                document.getElementById('analyzeBtn').disabled = false;
            }
        }
        function exportExcel() {
            if (!lastParsedData) return;

            const patientId = document.getElementById('患者ID') || document.getElementById('patientId').value.trim();
            const flatRow = {
                "患者ID": patientId,
                "解析日時": new Date().toLocaleString(),
                "評価尺度": lastParsedData.scaleType,
                ...lastParsedData.scores,
                "備考": lastParsedData.rawNotes
            };

            const worksheet = XLSX.utils.json_to_sheet([flatRow]);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "AI解析結果");

            XLSX.writeFile(workbook, `KOOS_AI_${patientId}.xlsx`);
        }
    </script>
</body>
</html>
