<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOOS & Lysholm AI 読み取りツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Excel出力用 (SheetJS) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md space-y-6">
        <!-- ヘッダー ＆ バージョン表示 -->
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-xl font-bold text-slate-700">KOOS / Lysholm AIスキャナー</h1>
                <p class="text-xs text-slate-500 mt-1">紙の問診票（最大5枚）を一括解析します。</p>
            </div>
            <!-- バージョン v6 -->
            <span class="bg-purple-100 text-purple-700 text-[10px] font-mono px-2 py-1 rounded font-bold">Ver: 2026.11.11-v6</span>
        </div>

        <!-- APIキー設定エリア -->
        <div class="p-4 bg-slate-50 rounded-lg border space-y-2">
            <label class="block text-xs font-semibold text-slate-600">Google AI Studio APIキー</label>
            <div class="flex gap-2">
                <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full text-xs p-2 border rounded bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <button onclick="saveApiKey()" class="bg-slate-700 text-white text-xs px-4 py-2 rounded font-medium hover:bg-slate-800 transition">保存</button>
            </div>
            <p class="text-[10px] text-slate-400">※キーはブラウザ内（LocalStorage）にのみ保存されます。</p>
        </div>

        <!-- 患者ID & 評価日設定エリア -->
        <div class="grid grid-cols-2 gap-3">
            <div class="p-3 bg-blue-50 rounded-lg border border-blue-100 space-y-1">
                <label class="block text-xs font-semibold text-blue-800">患者ID（匿名）</label>
                <input type="text" id="patientId" placeholder="例: PT-12345" class="w-full text-xs p-2 border rounded bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div class="p-3 bg-blue-50 rounded-lg border border-blue-100 space-y-1">
                <label class="block text-xs font-semibold text-blue-800">問診票の記載日</label>
                <input type="date" id="evalDate" class="w-full text-xs p-2 border rounded bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
        </div>

        <!-- 複数画像アップロードエリア（最大5枚） -->
        <div class="p-4 border-2 border-dashed border-slate-300 rounded-lg text-center space-y-3">
            <label class="block text-xs font-semibold text-slate-600">問診票の画像を選択・撮影（全5枚まで選択可能）</label>
            <input type="file" id="imageInput" accept="image/*" multiple capture="environment" class="text-xs w-full text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" />
            <!-- プレビュー一覧 -->
            <div id="previewContainer" class="hidden grid grid-cols-5 gap-2 mt-2 pt-2 border-t"></div>
        </div>

        <!-- 解析実行ボタン -->
        <button onclick="analyzeImages()" id="analyzeBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold shadow hover:bg-blue-700 transition text-sm flex items-center justify-center gap-2">
            全画像をAI一括解析する
        </button>

        <!-- ステータス・ログ表示エリア -->
        <div id="statusArea" class="hidden p-3 bg-amber-50 text-amber-800 rounded-lg text-xs font-medium"></div>

        <div id="resultContainer" class="hidden space-y-4 pt-4 border-t">
            <h2 class="text-sm font-bold text-slate-700">解析・抽出結果（確認用）</h2>
            <div id="resultOutput" class="p-3 bg-slate-50 rounded border text-xs font-mono whitespace-pre-wrap max-h-40 overflow-y-auto"></div>
            
            <button onclick="exportExcel()" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold shadow hover:bg-emerald-700 transition text-sm">
                Excel (xlsx) をダウンロード
            </button>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
            document.getElementById('evalDate').valueAsDate = new Date();
            console.log("App loaded: Ver 2026.11.11-v6");
        };

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('APIキーをブラウザに保存しました。');
            } else {
                localStorage.removeItem('gemini_api_key');
                alert('APIキーを削除しました。');
            }
        }

        let base64Images = [];
        let lastParsedData = null;

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            base64Images = [];
            const previewContainer = document.getElementById('previewContainer');
            previewContainer.innerHTML = '';
            previewContainer.classList.remove('hidden');

            files.forEach((file) => {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    base64Images.push(uploadEvent.target.result);
                    const img = document.createElement('img');
                    img.src = uploadEvent.target.result;
                    img.className = "h-16 w-full object-cover rounded border shadow-sm";
                    previewContainer.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        });

        async function analyzeImages() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const patientId = document.getElementById('patientId').value.trim();
            const evalDate = document.getElementById('evalDate').value;

            if (!apiKey) {
                alert('APIキーを入力してください。');
                return;
            }
            if (!patientId) {
                alert('患者IDを入力してください。');
                return;
            }
            if (base64Images.length === 0) {
                alert('問診票の画像を少なくとも1枚以上選択してください。');
                return;
            }

            const statusArea = document.getElementById('statusArea');
            statusArea.textContent = `[Ver.v6] AIが ${base64Images.length}枚の画像を解析中です...`;
            statusArea.classList.remove('hidden', 'bg-rose-50', 'text-rose-800', 'bg-emerald-50', 'text-emerald-800');
            statusArea.classList.add('bg-amber-50', 'text-amber-800');
            document.getElementById('analyzeBtn').disabled = true;

            const parts = [];
            const promptText = `
あなたは医療文書のデータ抽出アシスタントです。
添付された複数枚の画像は膝関節評価用問診票（KOOS全セクションおよびLysholmスコア）です。
すべての画像に目を通し、チェックが入っている箇所や選択されている項目を統合して、以下のJSONフォーマットのみで結果を出力してください。余計な解説文は一切不要です。

{
  "scaleType": "KOOS & Lysholm",
  "scores": {
    "項目名またはサブスケール名": 抽出された数値またはスコア
  },
  "rawNotes": "特記事項や読み取りメモがあれば簡潔に"
}
            `.trim();

            parts.push({ text: promptText });

            for (let imgBase64 of base64Images) {
                const matches = imgBase64.match(/^data:(.+?);base64,(.+)$/);
                if (matches) {
                    parts.push({
                        inline_data: {
                            mime_type: matches[1],
                            data: matches[2]
                        }
                    });
                }
            }

            const requestBody = {
                contents: [{ parts: parts }]
            };

            try {
                // モデル名を現在確実にサポートされている gemini-1.5-pro に変更してルーティング回避
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiText = data.candidates[0].content.parts[0].text;
                const cleanJsonStr = aiText.replace(/```json/g, '').replace(/```/g, '').trim();
                lastParsedData = JSON.parse(cleanJsonStr);

URL
                document.getElementById('resultOutput').textContent = JSON.stringify(lastParsedData, null, 2);
                document.getElementById('resultContainer').classList.remove('hidden');
                statusArea.textContent = '解析が完了しました。内容を確認してExcelを出力してください。';
                statusArea.classList.remove('bg-amber-50', 'text-amber-800');
                statusArea.classList.add('bg-emerald-50', 'text-emerald-800');

            } catch (error) {
                console.error(error);
                statusArea.textContent = 'APIエラー: ' + error.message;
                statusArea.classList.remove('bg-amber-50', 'text-amber-800');
                statusArea.classList.add('bg-rose-50', 'text-rose-800');
            } finally {
                document.getElementById('analyzeBtn').disabled = false;
            }
        }

        function exportExcel() {
            if (!lastParsedData) return;

            const patientId = document.getElementById('patientId').value.trim();
            const evalDate = document.getElementById('evalDate').value;

            const flatRow = {
                "患者ID": patientId,
                "記載日": evalDate,
                "解析日時": new Date().toLocaleString(),
                "評価尺度": lastParsedData.scaleType,
                ...lastParsedData.scores,
                "備考": lastParsedData.rawNotes
            };

            const worksheet = XLSX.utils.json_to_sheet([flatRow]);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "AI解析結果");

            XLSX.writeFile(workbook, `KOOS_Lysholm_${patientId}_${evalDate}.xlsx`);
        }
    </script>
</body>
</html>
