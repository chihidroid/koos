<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOOS & Lysholm スマホ一括スキャナー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Excel出力用ライブラリ (SheetJS) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4">
    <div class="max-w-md mx-auto bg-white p-5 rounded-xl shadow-md">
        <h1 class="text-lg font-bold mb-2 text-slate-700">KOOS / Lysholm 自動スキャナー</h1>
        <p class="text-xs text-slate-500 mb-4">問診票（全ページ）の画像を選択または撮影してください。AIが自動でスコアを算出してExcelで出力します。</p>

        <!-- カメラ・ファイル選択エリア（複数枚選択可） -->
        <div class="mb-4">
            <label class="block w-full bg-blue-600 text-white text-center py-3 rounded-lg font-semibold cursor-pointer shadow hover:bg-blue-700 transition">
                問診票の画像を選択 (複数可)
                <input type="file" id="imageInput" accept="image/*" multiple class="hidden" />
            </label>
            <p class="text-[10px] text-slate-400 mt-1 text-center">※スマホの場合はカメラ起動またはライブラリから複数選択できます</p>
        </div>

        <!-- 選択された画像のプレビュー -->
        <div id="previewArea" class="mb-4 hidden">
            <h2 class="text-xs font-semibold text-slate-600 mb-1">選択された画像 (<span id="imageCount">0</span>枚)</h2>
            <div id="thumbnailContainer" class="flex gap-2 overflow-x-auto p-2 bg-slate-50 rounded-lg border"></div>
        </div>

        <!-- 解析実行ボタン -->
        <div id="actionArea" class="mb-4 hidden">
            <button onclick="startAnalysis()" class="w-full bg-amber-600 text-white py-2.5 rounded-lg font-semibold shadow hover:bg-amber-700 transition text-sm">
                AI解析・スコア計算を実行
            </button>
        </div>

        <!-- 処理状況・結果表示エリア -->
        <div id="statusArea" class="hidden bg-slate-50 p-3 rounded-lg text-xs font-mono mb-4 border">
            <p id="statusText" class="text-blue-600">待機中...</p>
        </div>

        <!-- ダウンロードボタン -->
        <div id="downloadArea" class="hidden">
            <button onclick="downloadExcel()" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold shadow hover:bg-emerald-700 transition">
                Excel (xlsx) をダウンロード
            </button>
        </div>
    </div>

    <script>
        let selectedFiles = [];
        let parsedData = null;

        document.getElementById('imageInput').addEventListener('change', function(e) {
            selectedFiles = Array.from(e.target.files);
            if (selectedFiles.length === 0) return;

            const container = document.getElementById('thumbnailContainer');
            container.innerHTML = '';
            document.getElementById('imageCount').innerText = selectedFiles.length;

            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    img.className = 'w-16 h-16 object-cover rounded border';
                    container.appendChild(img);
                }
                reader.readAsDataURL(file);
            });

            document.getElementById('previewArea').classList.remove('hidden');
            document.getElementById('actionArea').classList.remove('hidden');
            document.getElementById('statusArea').classList.add('hidden');
            document.getElementById('downloadArea').classList.add('hidden');
        });

        function startAnalysis() {
            document.getElementById('statusArea').classList.remove('hidden');
            document.getElementById('statusText.className = "text-blue-600";
            document.getElementById('statusText').innerText = "AIが手書き画像をスキャン中... (KOOS / Lysholm解析)";

            // 実際の運用ではここで選択された画像をGemini API (Vision) に送信し、
            // 構造化されたJSONデータを取得します。現在はプロトタイプ用の疑似処理です。
            setTimeout(() => {
                parsedData = {
                    patientId: "ID_SAMPLE_001",
                    date: new Date().toLocaleDateString(),
                    // KOOS スコア (0-100)
                    koos_symptoms: 85.7,
                    koos_pain: 88.9,
                    koos_adl: 91.2,
                    koos_sport: 75.0,
                    koos_qol: 68.8,
                    // Lysholm スコア (0-100)
                    lysholm_total: 87
                };

                document.getElementById('statusText').innerHTML = `
                    <span class="text-emerald-600 font-bold">解析成功！</span><br>
                    - 受付ID: ${parsedData.patientId}<br>
                    - KOOS 症状: ${parsedData.koos_symptoms} | 痛み: ${parsedData.koos_pain}<br>
                    - KOOS ADL: ${parsedData.koos_adl} | スポーツ: ${parsedData.koos_sport}<br>
                    - KOOS QOL: ${parsedData.koos_qol}<br>
                    - Lysholm 合計: ${parsedData.lysholm_total}点
                `;
                document.getElementById('downloadArea').classList.remove('hidden');
            }, 2000);
        }

        function downloadExcel() {
            if (!parsedData) return;

            const rowData = [{
                "ID": parsedData.patientId,
                "記入日": parsedData.date,
                "KOOS_症状": parsedData.koos_symptoms,
                "KOOS_痛み": parsedData.koos_pain,
                "KOOS_ADL": parsedData.koos_adl,
                "KOOS_スポーツ": parsedData.koos_sport,
                "KOOS_QOL": parsedData.koos_qol,
                "Lysholm_合計": parsedData.lysholm_total,
                "データ取得日時": new Date().toLocaleString()
            }];

            const worksheet = XLSX.utils.json_to_sheet(rowData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "KOOS_Lysholm_集計");

            XLSX.writeFile(workbook, `KOOS_${parsedData.patientId}.xlsx`);
        }
    </script>
</body>
</html>
